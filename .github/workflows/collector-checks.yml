name: Collector checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-checks:
    name: collector-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -m compileall -q collector.py native_host.py domain.py export_supervisor.py intake.py build_portable.py version_report.py
      - name: Check collector boundaries with synthetic fixtures
        run: python3 -B -m unittest discover -s tests -v
